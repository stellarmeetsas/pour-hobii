<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140810" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>Pour Hobii — un secret t’attend</title>
  <meta name="description" content="Hobii, un secret t’attend… réussis le défi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Outfit:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    :root {
      --night: #140810;
      --blush: #ff9bb8;
      --rose: #ff4f86;
      --petal: #ffe6ef;
      --gold: #ffd4a8;
      --cream: #fff7fa;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --hud-h: 5.5rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: "Outfit", system-ui, -apple-system, sans-serif;
      color: var(--cream);
      background: var(--night);
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .sky {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 70% at 50% -5%, #7a2a48 0%, transparent 52%),
        radial-gradient(ellipse 80% 55% at 100% 85%, #3a1528 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 0% 75%, #4a1a30 0%, transparent 48%),
        linear-gradient(168deg, #0c060a 0%, #24101a 42%, #140810 100%);
      z-index: 0;
    }

    .bloom {
      position: fixed;
      left: 50%;
      top: 42%;
      width: min(92vw, 28rem);
      height: min(92vw, 28rem);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 79, 134, 0.28) 0%, rgba(255, 79, 134, 0.1) 38%, transparent 68%);
      filter: blur(2px);
      animation: bloom 5.5s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes bloom {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 48%, transparent 26%, rgba(8, 2, 6, 0.58) 100%),
        linear-gradient(to top, rgba(8, 2, 6, 0.5) 0%, transparent 26%),
        linear-gradient(to bottom, rgba(8, 2, 6, 0.3) 0%, transparent 16%);
      z-index: 2;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(1.1rem, var(--safe-top))
        max(1rem, var(--safe-right))
        max(1.25rem, calc(var(--safe-bottom) + 0.5rem))
        max(1rem, var(--safe-left));
      transition: opacity 0.55s ease, visibility 0.55s ease, transform 0.55s ease;
    }

    .screen[hidden] {
      display: none !important;
    }

    .screen.is-leaving {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.04);
      pointer-events: none;
    }

    /* —— INTRO —— */
    #intro {
      text-align: center;
      gap: 0;
    }

    .intro-card {
      width: min(100%, 22rem);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: clamp(0.62rem, 2.6vw, 0.72rem);
      letter-spacing: 0.26em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--gold);
      opacity: 0.92;
      margin-bottom: 1.35rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid rgba(255, 212, 168, 0.22);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fade 1s 0.15s both;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "✦";
      font-size: 0.55rem;
      opacity: 0.7;
      letter-spacing: 0;
    }

    .intro-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(1.85rem, 8.2vw, 2.85rem);
      line-height: 1.2;
      color: var(--petal);
      text-wrap: balance;
      text-shadow: 0 0 2rem rgba(255, 79, 134, 0.35);
      animation: fade 1s 0.3s both;
      margin-bottom: 0.85rem;
    }

    .intro-sub {
      font-weight: 300;
      font-size: clamp(0.95rem, 3.8vw, 1.1rem);
      line-height: 1.45;
      color: rgba(255, 230, 239, 0.72);
      text-wrap: balance;
      animation: fade 1s 0.45s both;
      margin-bottom: 1.75rem;
    }

    .intro-sub strong {
      color: var(--blush);
      font-weight: 500;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 3.15rem;
      min-width: 12rem;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 155, 184, 0.4);
      background: linear-gradient(165deg, rgba(255, 79, 134, 0.35), rgba(255, 79, 134, 0.12));
      color: var(--cream);
      font: inherit;
      font-size: clamp(0.88rem, 3.4vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 0 2rem rgba(255, 79, 134, 0.25);
      animation: fade 1s 0.6s both, softpulse 2.4s 1.4s ease-in-out infinite;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .cta:active {
      transform: scale(0.96);
      background: linear-gradient(165deg, rgba(255, 79, 134, 0.5), rgba(255, 79, 134, 0.2));
    }

    .cta:focus-visible {
      outline: 2px solid var(--blush);
      outline-offset: 3px;
    }

    @keyframes softpulse {
      0%, 100% { box-shadow: 0 0 1.6rem rgba(255, 79, 134, 0.22); }
      50% { box-shadow: 0 0 2.4rem rgba(255, 79, 134, 0.45); }
    }

    /* —— GAME —— */
    #game {
      justify-content: flex-start;
      padding-top: max(0.75rem, var(--safe-top));
      padding-bottom: max(0.75rem, var(--safe-bottom));
    }

    .hud {
      width: min(100%, 28rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
      z-index: 5;
      flex-shrink: 0;
      pointer-events: none;
    }

    .hud-title {
      font-size: clamp(0.7rem, 2.8vw, 0.8rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 212, 168, 0.85);
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(1.35rem, 5.5vw, 1.7rem);
      color: var(--petal);
      text-shadow: 0 0 1rem rgba(255, 79, 134, 0.4);
    }

    .counter .n {
      display: inline-block;
      min-width: 1.4ch;
      color: var(--rose);
      font-weight: 600;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .counter .n.pop {
      transform: scale(1.35);
    }

    .progress {
      width: min(100%, 14rem);
      height: 0.35rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border: 1px solid rgba(255, 155, 184, 0.18);
    }

    .progress > i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff4f86, #ff9bb8, #ffd4a8);
      box-shadow: 0 0 0.8rem rgba(255, 79, 134, 0.55);
      transition: width 0.28s ease;
    }

    .hint {
      margin-top: 0.15rem;
      font-size: clamp(0.72rem, 2.9vw, 0.82rem);
      color: rgba(255, 230, 239, 0.55);
      letter-spacing: 0.02em;
    }

    .arena {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 28rem;
      margin-top: 0.35rem;
      min-height: 0;
      touch-action: manipulation;
    }

    .target {
      position: absolute;
      width: 3.4rem;
      height: 3.4rem;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 4;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 0 0.7rem rgba(255, 79, 134, 0.65));
      animation: targetIn 0.35s cubic-bezier(0.34, 1.4, 0.64, 1) both;
      will-change: left, top, transform;
    }

    .target span {
      font-size: 2.35rem;
      line-height: 1;
      color: var(--rose);
      pointer-events: none;
      animation: heartbeat 1.1s ease-in-out infinite;
      text-shadow: 0 0 0.85rem rgba(255, 155, 184, 0.7);
    }

    .target.caught {
      pointer-events: none;
      animation: catchPop 0.38s ease forwards;
    }

    @keyframes targetIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.12); }
      55% { transform: scale(0.96); }
    }

    @keyframes catchPop {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      55% { opacity: 1; transform: translate(-50%, -50%) scale(1.55); filter: drop-shadow(0 0 1.4rem rgba(255, 212, 168, 0.9)); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
    }

    /* —— REVEAL —— */
    #reveal {
      text-align: center;
      opacity: 0;
      pointer-events: none;
      z-index: 6;
    }

    #reveal.is-on {
      opacity: 1;
      pointer-events: auto;
    }

    .reveal-inner {
      width: min(100%, 34rem);
    }

    #reveal.is-on .eyebrow { animation: fade 0.9s 0.15s both; }
    #reveal.is-on .love {
      animation: revealIn 1.15s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #reveal.is-on .divider { animation: fade 0.9s 0.75s both; }
    #reveal.is-on .sig { animation: fade 0.9s 0.95s both; }

    .love {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-style: italic;
      font-size: clamp(1.65rem, 7.5vw, 2.95rem);
      line-height: 1.22;
      color: var(--petal);
      text-wrap: balance;
      text-shadow: 0 0 2.2rem rgba(255, 79, 134, 0.55);
      padding-inline: 0.1rem;
    }

    .love .line { display: block; }

    .love .name {
      display: inline-block;
      margin-top: 0.35rem;
      color: var(--rose);
      font-size: 1.08em;
      letter-spacing: 0.02em;
      animation: glow 2.8s ease-in-out infinite;
    }

    @keyframes revealIn {
      from {
        opacity: 0;
        transform: scale(0.82) translateY(1.2rem);
        filter: blur(8px);
        text-shadow: 0 0 0 transparent;
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
        text-shadow: 0 0 2.2rem rgba(255, 79, 134, 0.55);
      }
    }

    @keyframes glow {
      0%, 100% { text-shadow: 0 0 0.75rem rgba(255, 79, 134, 0.45); transform: scale(1); }
      50% { text-shadow: 0 0 1.6rem rgba(255, 155, 184, 0.95), 0 0 2.8rem rgba(255, 79, 134, 0.45); transform: scale(1.03); }
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin: clamp(1.25rem, 4.2vh, 2rem) auto;
    }

    .divider span {
      width: clamp(2rem, 10vw, 3.5rem);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 212, 168, 0.55), transparent);
    }

    .divider .hearts {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }

    .divider .hearts i {
      font-style: normal;
      font-size: clamp(0.95rem, 3.8vw, 1.2rem);
      color: var(--blush);
      animation: floaty 2.35s ease-in-out infinite;
      filter: drop-shadow(0 0 0.55rem rgba(255, 79, 134, 0.6));
      line-height: 1;
    }

    .divider .hearts i:nth-child(2) {
      animation-delay: 0.35s;
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      color: var(--rose);
    }

    .divider .hearts i:nth-child(3) { animation-delay: 0.7s; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-0.45rem) scale(1.12); }
    }

    .sig .label {
      font-size: clamp(0.68rem, 2.8vw, 0.78rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 247, 250, 0.5);
      margin-bottom: 0.2rem;
    }

    .sig .sign {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.55rem, 12vw, 3.75rem);
      color: var(--gold);
      line-height: 1.15;
      text-shadow: 0 0 1.4rem rgba(255, 212, 168, 0.4);
      padding-inline: 0.25rem;
    }

    .flash {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, rgba(255, 230, 239, 0.55), transparent 55%);
      opacity: 0;
    }

    .flash.go {
      animation: flashBang 0.9s ease-out forwards;
    }

    @keyframes flashBang {
      0% { opacity: 0; }
      18% { opacity: 1; }
      100% { opacity: 0; }
    }

    .burst {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: clamp(1.1rem, 4.5vw, 1.55rem);
      will-change: transform, opacity;
      animation: burst 1s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      filter: drop-shadow(0 0 0.4rem rgba(255, 79, 134, 0.55));
    }

    @keyframes burst {
      0% { opacity: 1; transform: translate(0, 0) scale(0.55) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.35) rotate(var(--rot)); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(1.4rem) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(0.85rem); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 640px) {
      .love { font-size: clamp(2.2rem, 4.2vw, 3rem); }
      .target { width: 3.7rem; height: 3.7rem; }
      .target span { font-size: 2.55rem; }
    }

    @media (max-height: 640px) and (orientation: landscape) {
      #intro, #reveal { justify-content: flex-start; overflow-y: auto; }
      .love { font-size: clamp(1.3rem, 5.2vh, 1.9rem); }
      .sig .sign { font-size: clamp(2rem, 8vh, 2.8rem); }
      .divider { margin-block: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div class="bloom" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <section class="screen" id="intro" aria-label="Introduction">
    <div class="intro-card">
      <p class="eyebrow">un secret t’attend</p>
      <h1 class="intro-title">Hobii, à toi de jouer</h1>
      <p class="intro-sub">
        Réussis le défi&nbsp;:<br />
        <strong>attrape 7 cœurs</strong> qui s’échappent.
      </p>
      <button class="cta" type="button" id="startBtn">
        <span aria-hidden="true">♥</span>
        Commencer
      </button>
    </div>
  </section>

  <section class="screen" id="game" hidden aria-label="Défi attrape les cœurs">
    <div class="hud">
      <p class="hud-title">Attrape 7 cœurs</p>
      <div class="counter" aria-live="polite">
        <span class="n" id="count">0</span>
        <span>/ 7</span>
        <span aria-hidden="true">♥</span>
      </div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <p class="hint">Tape vite sur les cœurs</p>
    </div>
    <div class="arena" id="arena" role="application" aria-label="Zone de jeu"></div>
  </section>

  <section class="screen" id="reveal" hidden aria-label="Message secret" aria-live="polite">
    <div class="reveal-inner">
      <p class="eyebrow">rien que pour toi</p>
      <h1 class="love">
        <span class="line">J’ai créé un site juste pour te dire</span>
        <span class="line">que je t’aime,</span>
        <span class="name">Hobii</span>
      </h1>
      <div class="divider" aria-hidden="true">
        <span></span>
        <div class="hearts"><i>♥</i><i>♥</i><i>♥</i></div>
        <span></span>
      </div>
      <div class="sig">
        <p class="label">signé</p>
        <div class="sign">le grand H</div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const NEED = 7;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const intro = document.getElementById("intro");
      const game = document.getElementById("game");
      const reveal = document.getElementById("reveal");
      const arena = document.getElementById("arena");
      const countEl = document.getElementById("count");
      const bar = document.getElementById("bar");
      const flash = document.getElementById("flash");
      const startBtn = document.getElementById("startBtn");

      let caught = 0;
      let playing = false;
      let targets = [];
      let moveRaf = 0;
      let won = false;

      /* —— ambient canvas —— */
      const canvas = document.getElementById("fx");
      const ctx = canvas.getContext("2d", { alpha: true });
      let w = 0, h = 0, dpr = 1, sparks = [], hearts = [], raf = 0;

      const isMobile = () =>
        Math.min(window.innerWidth, window.innerHeight) < 720
        || matchMedia("(pointer: coarse)").matches;

      function resizeFx() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makeSpark() {
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * (isMobile() ? 1.45 : 1.85) + 0.35,
          a: Math.random() * 0.85 + 0.15,
          s: Math.random() * 0.016 + 0.004,
          tw: Math.random() * Math.PI * 2,
        };
      }

      function makeHeart(fromBottom) {
        const size = Math.random() * (isMobile() ? 11 : 14) + 6;
        return {
          x: Math.random() * w,
          y: fromBottom === false ? Math.random() * h : h + Math.random() * 90 + 20,
          size,
          speed: Math.random() * 0.5 + 0.18,
          drift: (Math.random() - 0.5) * 0.42,
          rot: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.02,
          alpha: Math.random() * 0.38 + 0.18,
          hue: Math.random() > 0.45 ? "#ff9bb8" : "#ff4f86",
        };
      }

      function seedFx() {
        const mobile = isMobile();
        sparks = Array.from({ length: mobile ? 48 : 90 }, makeSpark);
        hearts = Array.from({ length: mobile ? 10 : 16 }, () => makeHeart(false));
      }

      function drawHeartPath(x, y, s, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        const k = s / 16;
        ctx.moveTo(0, 3 * k);
        ctx.bezierCurveTo(-10 * k, -8 * k, -16 * k, 4 * k, 0, 14 * k);
        ctx.bezierCurveTo(16 * k, 4 * k, 10 * k, -8 * k, 0, 3 * k);
        ctx.fill();
        ctx.restore();
      }

      function frame(t) {
        ctx.clearRect(0, 0, w, h);
        for (const p of sparks) {
          p.tw += p.s;
          const twinkle = 0.3 + 0.7 * Math.abs(Math.sin(p.tw));
          ctx.beginPath();
          ctx.fillStyle = `rgba(255, 232, 214, ${p.a * twinkle})`;
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          if (p.r > 1.15) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 212, 168, ${0.28 * twinkle})`;
            ctx.lineWidth = 0.55;
            const arm = p.r * 2.3;
            ctx.moveTo(p.x - arm, p.y);
            ctx.lineTo(p.x + arm, p.y);
            ctx.moveTo(p.x, p.y - arm);
            ctx.lineTo(p.x, p.y + arm);
            ctx.stroke();
          }
        }
        for (const ht of hearts) {
          ht.y -= ht.speed;
          ht.x += Math.sin(t / 900 + ht.y / 40) * ht.drift;
          ht.rot += ht.spin;
          if (ht.y < -40) Object.assign(ht, makeHeart(true));
          ctx.globalAlpha = ht.alpha;
          ctx.fillStyle = ht.hue;
          drawHeartPath(ht.x, ht.y, ht.size, ht.rot);
          ctx.globalAlpha = 1;
        }
        raf = requestAnimationFrame(frame);
      }

      function burstAt(x, y, heavy) {
        if (navigator.vibrate) navigator.vibrate(heavy ? [18, 30, 28] : 12);
        const count = heavy ? (isMobile() ? 28 : 36) : (isMobile() ? 12 : 16);
        for (let i = 0; i < count; i++) {
          const el = document.createElement("span");
          el.className = "burst";
          el.textContent = Math.random() > 0.22 ? "♥" : "✨";
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.35;
          const dist = (heavy ? 70 : 48) + Math.random() * (heavy ? 110 : 70);
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
          el.style.setProperty("--dy", Math.sin(angle) * dist - 22 + "px");
          el.style.setProperty("--rot", (Math.random() * 50 - 25) + "deg");
          el.style.color = Math.random() > 0.4 ? "#ff9bb8" : "#ffd4a8";
          el.style.fontSize = heavy ? (1.2 + Math.random() * 0.9) + "rem" : "";
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1050);
        }
      }

      function confettiHearts() {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight * 0.42;
        burstAt(cx, cy, true);
        setTimeout(() => burstAt(cx * 0.55, cy * 0.85, true), 180);
        setTimeout(() => burstAt(cx * 1.4, cy * 0.9, true), 320);
        setTimeout(() => burstAt(cx, cy * 1.15, true), 480);
      }

      /* —— game —— */
      function updateHud() {
        countEl.textContent = String(caught);
        countEl.classList.remove("pop");
        void countEl.offsetWidth;
        countEl.classList.add("pop");
        bar.style.width = ((caught / NEED) * 100) + "%";
      }

      function arenaBox() {
        const r = arena.getBoundingClientRect();
        return { w: r.width, h: r.height, left: r.left, top: r.top };
      }

      function randPos(pad) {
        const box = arenaBox();
        const p = pad || 44;
        return {
          x: p + Math.random() * Math.max(20, box.w - p * 2),
          y: p + Math.random() * Math.max(20, box.h - p * 2),
        };
      }

      function spawnTarget() {
        if (!playing || won) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "target";
        btn.setAttribute("aria-label", "Cœur à attraper");
        btn.innerHTML = "<span>♥</span>";

        const pos = randPos();
        let x = pos.x;
        let y = pos.y;
        const speed = (isMobile() ? 55 : 70) + Math.random() * 55 + caught * 8;
        let angle = Math.random() * Math.PI * 2;
        let wobble = Math.random() * Math.PI * 2;
        let last = performance.now();

        btn.style.left = x + "px";
        btn.style.top = y + "px";

        const state = { btn, x, y, speed, angle, wobble, last, alive: true };
        targets.push(state);
        arena.appendChild(btn);

        const catchIt = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (!state.alive || won) return;
          state.alive = false;
          btn.classList.add("caught");
          const rect = btn.getBoundingClientRect();
          burstAt(rect.left + rect.width / 2, rect.top + rect.height / 2, false);
          caught += 1;
          updateHud();
          setTimeout(() => {
            btn.remove();
            targets = targets.filter((t) => t !== state);
          }, 360);
          if (caught >= NEED) {
            win();
          } else if (playing) {
            setTimeout(spawnTarget, 180 + Math.random() * 220);
            if (caught === 3 || caught === 5) setTimeout(spawnTarget, 420);
          }
        };

        btn.addEventListener("pointerdown", catchIt);
      }

      function moveLoop(now) {
        if (!playing) return;
        const box = arenaBox();
        for (const t of targets) {
          if (!t.alive) continue;
          const dt = Math.min(0.05, (now - t.last) / 1000);
          t.last = now;
          t.wobble += dt * 2.4;
          t.angle += Math.sin(t.wobble) * 0.9 * dt;
          t.x += Math.cos(t.angle) * t.speed * dt;
          t.y += Math.sin(t.angle) * t.speed * dt;

          const pad = 28;
          if (t.x < pad) { t.x = pad; t.angle = Math.PI - t.angle; }
          if (t.x > box.w - pad) { t.x = box.w - pad; t.angle = Math.PI - t.angle; }
          if (t.y < pad) { t.y = pad; t.angle = -t.angle; }
          if (t.y > box.h - pad) { t.y = box.h - pad; t.angle = -t.angle; }

          t.btn.style.left = t.x + "px";
          t.btn.style.top = t.y + "px";
        }
        moveRaf = requestAnimationFrame(moveLoop);
      }

      function clearTargets() {
        for (const t of targets) t.btn.remove();
        targets = [];
        if (moveRaf) cancelAnimationFrame(moveRaf);
        moveRaf = 0;
      }

      function startGame() {
        caught = 0;
        won = false;
        playing = true;
        updateHud();
        clearTargets();
        intro.classList.add("is-leaving");
        setTimeout(() => {
          intro.hidden = true;
          intro.classList.remove("is-leaving");
          game.hidden = false;
          spawnTarget();
          setTimeout(spawnTarget, 500);
          moveRaf = requestAnimationFrame(moveLoop);
        }, reduce ? 0 : 420);
      }

      function win() {
        if (won) return;
        won = true;
        playing = false;
        clearTargets();
        flash.classList.add("go");
        confettiHearts();
        game.classList.add("is-leaving");
        setTimeout(() => {
          game.hidden = true;
          game.classList.remove("is-leaving");
          reveal.hidden = false;
          requestAnimationFrame(() => reveal.classList.add("is-on"));
          confettiHearts();
        }, reduce ? 80 : 520);
        setTimeout(() => flash.classList.remove("go"), 1000);
      }

      startBtn.addEventListener("click", startGame);

      resizeFx();
      seedFx();
      window.addEventListener("resize", () => {
        resizeFx();
        seedFx();
      }, { passive: true });
      if (!reduce) raf = requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
